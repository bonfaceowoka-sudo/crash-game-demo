<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crash Game Demo</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050912;
color:#fff;
font-family:Arial,sans-serif;
}

.wrap{
width:100%;
max-width:500px;
margin:auto;
padding:14px;
}

/* HEADER */

.brand{
text-align:center;
font-size:30px;
font-weight:900;
color:#20e0a0;
margin:8px 0 16px;
text-shadow:0 0 18px #20e0a0;
}

/* BALANCE */

.balance{
background:#101827;
border:1px solid #263653;
border-radius:16px;
padding:15px;
text-align:center;
box-shadow:0 0 25px #0008;
}

.balance small{
color:#8fa2ba;
font-size:12px;
}

.balance span{
display:block;
font-size:32px;
font-weight:900;
margin-top:4px;
}

/* STATS */

.stats{
display:flex;
gap:8px;
margin-top:9px;
}

.stat{
flex:1;
background:#101827;
border:1px solid #263653;
border-radius:12px;
padding:10px;
text-align:center;
}

.stat small{
display:block;
font-size:10px;
color:#8295ad;
}

.stat strong{
display:block;
font-size:17px;
margin-top:4px;
}

.live{
color:#20e0a0;
}

/* GAME */

.game{
margin-top:12px;
background:#08111f;
border:1px solid #263653;
border-radius:16px;
padding:12px;
text-align:center;
box-shadow:inset 0 0 40px #0009;
}

.countdown{
height:42px;
font-size:34px;
font-weight:900;
color:#20e0a0;
text-shadow:0 0 18px #20e0a0;
}

.mult{
font-size:60px;
font-weight:900;
margin:5px 0;
color:#20e0a0;
text-shadow:0 0 20px #20e0a0;
}

.mult.crashed{
color:#ff3333;
text-shadow:
0 0 12px #ff2222,
0 0 30px #ff0000;
}

.status{
height:25px;
font-size:14px;
color:#9fb0c5;
}

/* GRAPH */

.graphbox{
position:relative;
width:100%;
height:250px;
margin-top:6px;
overflow:hidden;
border-radius:13px;
}

#graph{
width:100%;
height:250px;
background:
radial-gradient(
circle at center,
#10243c 0%,
#09111f 72%
);
border:1px solid #1e304d;
border-radius:13px;
}

/* ROCKET */

#rocket{
position:absolute;
display:none;
font-size:34px;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:5;

filter:
drop-shadow(0 0 6px #20e0a0)
drop-shadow(0 0 14px #20e0a0)
drop-shadow(0 0 25px #20e0a0);
}

#rocket:after{
content:"";
position:absolute;

width:45px;
height:9px;

right:21px;
top:14px;

background:linear-gradient(
to left,
#fff176,
#ff9800,
#ff3b20,
transparent
);

border-radius:50%;
filter:blur(3px);

z-index:-1;
}

/* CRASH ROCKET */

.crashedRocket{
animation:shake .08s infinite;
}

@keyframes shake{

0%{
transform:translate(-50%,-50%) rotate(-10deg);
}

50%{
transform:translate(-50%,-50%) rotate(10deg);
}

100%{
transform:translate(-50%,-50%) rotate(-10deg);
}

}

/* EXPLOSION */

#explosion{
position:absolute;
left:50%;
top:50%;

display:none;

font-size:75px;

transform:
translate(-50%,-50%)
scale(.1);

z-index:10;

pointer-events:none;
}

.explode{
display:block!important;
animation:explode .9s ease-out forwards;
}

@keyframes explode{

0%{
opacity:0;
transform:
translate(-50%,-50%)
scale(.1);
}

20%{
opacity:1;
transform:
translate(-50%,-50%)
scale(1.5);
}

55%{
opacity:1;
transform:
translate(-50%,-50%)
scale(1.1);
}

100%{
opacity:0;
transform:
translate(-50%,-50%)
scale(2.2);
}

}

/* CRASH FLASH */

.crashFlash{
animation:flash .5s ease;
}

@keyframes flash{

0%{
box-shadow:none;
}

30%{
box-shadow:
inset 0 0 90px rgba(255,0,0,.75),
0 0 35px rgba(255,0,0,.6);
}

100%{
box-shadow:none;
}

}

/* CONTROLS */

.controls{
margin-top:12px;
background:#101827;
border-radius:15px;
padding:14px;
}

label{
display:block;
font-size:14px;
color:#d8e2ef;
}

input,
button{
width:100%;
padding:15px;
margin-top:8px;
border-radius:11px;
border:0;
font-size:16px;
}

input{
background:#182235;
border:1px solid #263653;
color:#fff;
outline:none;
}

button{
background:#20e0a0;
color:#06140e;
font-weight:900;
box-shadow:0 0 14px #20e0a044;
}

button:active{
transform:scale(.98);
}

button:disabled{
opacity:.45;
}

.cash{
background:#ffb020;
color:#1a1100;
}

.reset{
background:#253a55;
color:#fff;
}

/* HISTORY */

.history{
margin-top:12px;
background:#101827;
border-radius:15px;
padding:14px;
}

.history h3{
margin:0 0 10px;
font-size:17px;
}

#historyList{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:3px;
}

.result{
padding:9px 13px;
border-radius:9px;
white-space:nowrap;
font-weight:900;
background:#321b1b;
color:#ff7777;
}

.result.win{
background:#123b2d;
color:#20e0a0;
}

/* INFO */

.info{
margin-top:12px;
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.infoBox{
background:#101827;
border:1px solid #263653;
border-radius:11px;
padding:10px;
text-align:center;
}

.infoBox small{
display:block;
color:#8295ad;
font-size:10px;
}

.infoBox strong{
display:block;
margin-top:4px;
font-size:14px;
}

/* NOTE */

.note{
text-align:center;
color:#71849b;
font-size:11px;
margin-top:14px;
padding-bottom:8px;
}

/* ANIMATIONS */

.balancePop{
animation:balancePop .35s ease;
}

@keyframes balancePop{

50%{
transform:scale(1.08);
}

}

.cashGlow{
animation:cashGlow .7s ease;
}

@keyframes cashGlow{

50%{
text-shadow:
0 0 12px #20e0a0,
0 0 35px #20e0a0;
}

}

</style>
</head>

<body>

<div class="wrap">

<div class="brand">
🚀 CRASH DEMO
</div>

<div
class="balance"
id="balanceBox"
>

<small>DEMO BALANCE</small>

<span id="balance">
1000.00
</span>

</div>


<div class="stats">

<div class="stat">

<small>STATUS</small>

<strong
id="liveStatus"
class="live"
>
READY
</strong>

</div>

<div class="stat">

<small>ROUND HIGH</small>

<strong id="high">
1.00x
</strong>

</div>

<div class="stat">

<small>CRASH</small>

<strong id="crashDisplay">
???
</strong>

</div>

</div>


<div
class="game"
id="gameBox"
>

<div
class="countdown"
id="countdown"
></div>

<div
class="mult"
id="mult"
>
1.00x
</div>

<div
class="status"
id="status"
>
Place your demo bet to start
</div>


<div class="graphbox">

<canvas id="graph"></canvas>

<div id="rocket">
🚀
</div>

<div id="explosion">
💥
</div>

</div>

</div>


<div class="controls">

<label>
Demo Bet Amount
</label>

<input
id="bet"
type="number"
min="1"
value="50"
>

<button
id="start"
onclick="startGame()"
>
🚀 START ROUND
</button>

<button
id="cash"
class="cash"
onclick="cashOut()"
disabled
>
💰 CASH OUT
</button>

<button
class="reset"
onclick="resetGame()"
>
RESET DEMO
</button>

</div>


<div class="history">

<h3>
🏆 Recent Results
</h3>

<div id="historyList">
</div>

</div>


<div class="info">

<div class="infoBox">

<small>GAME TYPE</small>

<strong>
DEMO CRASH
</strong>

</div>

<div class="infoBox">

<small>REAL MONEY</small>

<strong>
NO
</strong>

</div>

</div>


<div class="note">
DEMO GAME — VIRTUAL CREDITS ONLY
</div>

</div>


<script>

let balance=1000;

let multiplier=1;

let crashPoint=0;

let timer=null;

let countdownTimer=null;

let running=false;

let countingDown=false;

let betAmount=0;

let points=[];

let roundHigh=1;


/* ELEMENTS */

const balanceEl=
document.getElementById("balance");

const balanceBox=
document.getElementById("balanceBox");

const multEl=
document.getElementById("mult");

const statusEl=
document.getElementById("status");

const betEl=
document.getElementById("bet");

const startBtn=
document.getElementById("start");

const cashBtn=
document.getElementById("cash");

const historyList=
document.getElementById("historyList");

const gameBox=
document.getElementById("gameBox");

const canvas=
document.getElementById("graph");

const ctx=
canvas.getContext("2d");

const rocket=
document.getElementById("rocket");

const explosion=
document.getElementById("explosion");

const countdownEl=
document.getElementById("countdown");

const liveStatus=
document.getElementById("liveStatus");

const highEl=
document.getElementById("high");

const crashDisplay=
document.getElementById("crashDisplay");


/* CANVAS */

function resizeCanvas(){

const rect=
canvas.getBoundingClientRect();

canvas.width=
rect.width*
window.devicePixelRatio;

canvas.height=
rect.height*
window.devicePixelRatio;

ctx.setTransform(
window.devicePixelRatio,
0,
0,
window.devicePixelRatio,
0,
0
);

drawGraph();

}


/* BALANCE */

function updateBalance(){

balanceEl.textContent=
balance.toFixed(2);

balanceBox.classList.remove(
"balancePop"
);

void balanceBox.offsetWidth;

balanceBox.classList.add(
"balancePop"
);

}


/* RANDOM CRASH */

function randomCrash(){

return +(
1.05+
Math.random()*8.95
).toFixed(2);

}


/* START */

function startGame(){

if(
running ||
countingDown
)return;


betAmount=
Number(betEl.value);


if(
betAmount<=0
){

statusEl.textContent=
"Enter a valid demo bet.";

return;

}


if(
betAmount>balance
){

statusEl.textContent=
"Not enough demo balance.";

return;

}


balance-=
betAmount;

updateBalance();


multiplier=1;

roundHigh=1;

points=[1];

crashPoint=
randomCrash();


highEl.textContent=
"1.00x";

crashDisplay.textContent=
"???";


countingDown=true;

running=false;


startBtn.disabled=true;

betEl.disabled=true;

cashBtn.disabled=true;


liveStatus.textContent=
"READY";

statusEl.textContent=
"Get ready...";


rocket.style.display=
"none";

rocket.classList.remove(
"crashedRocket"
);

explosion.classList.remove(
"explode"
);

gameBox.classList.remove(
"crashFlash"
);

multEl.classList.remove(
"crashed",
"cashGlow"
);


let count=3;

countdownEl.textContent=
count;


countdownTimer=
setInterval(
function(){

count--;

if(count>0){

countdownEl.textContent=
count;

}else{

clearInterval(
countdownTimer
);

countdownEl.textContent="";

beginRound();

}

},
1000
);

}


/* BEGIN ROUND */

function beginRound(){

countingDown=false;

running=true;


liveStatus.textContent=
"LIVE";

statusEl.textContent=
"Round running...";


cashBtn.disabled=false;


rocket.style.display=
"block";


drawGraph();


timer=
setInterval(
runGame,
100
);

}


/* GAME LOOP */

function runGame(){

multiplier+=
0.01+
multiplier*0.006;


points.push(
multiplier
);


if(
multiplier>
roundHigh
){

roundHigh=
multiplier;

highEl.textContent=
roundHigh.toFixed(2)+"x";

}


multEl.textContent=
multiplier.toFixed(2)+"x";


drawGraph();


if(
multiplier>=crashPoint
){

crash();

}

}


/* GRAPH */

function drawGraph(){

const w=
canvas.clientWidth;

const h=
canvas.clientHeight;


ctx.clearRect(
0,
0,
w,
h
);


/* GRID */

ctx.strokeStyle=
"#172943";

ctx.lineWidth=1;


for(
let x=0;
x<w;
x+=40
){

ctx.beginPath();

ctx.moveTo(x,0);

ctx.lineTo(x,h);

ctx.stroke();

}


for(
let y=0;
y<h;
y+=40
){

ctx.beginPath();

ctx.moveTo(0,y);

ctx.lineTo(w,y);

ctx.stroke();

}


if(
points.length<2
){

rocket.style.left=
"10px";

rocket.style.top=
(h-20)+"px";

return;

}


const maxValue=
Math.max(
2,
...points
)*1.15;


let lastX=10;

let lastY=h-10;


/* PATH */

ctx.beginPath();


points.forEach(
function(value,i){

const x=
Math.min(
10+i*4,
w-20
);

const y=
h-
(
(value-1)/
(maxValue-1)*
(h-20)
)-
10;


if(i===0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}


lastX=x;

lastY=y;

});


/* GLOW */

ctx.strokeStyle=
"#20e0a044";

ctx.lineWidth=12;

ctx.lineJoin=
"round";

ctx.stroke();


/* MAIN LINE */

ctx.beginPath();


points.forEach(
function(value,i){

const x=
Math.min(
10+i*4,
w-20
);

const y=
h-
(
(value-1)/
(maxValue-1)*
(h-20)
)-
10;


if(i===0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}

});


ctx.strokeStyle=
"#20e0a0";

ctx.lineWidth=4;

ctx.lineJoin=
"round";

ctx.stroke();


/* ROCKET */

rocket.style.left=
lastX+"px";

rocket.style.top=
lastY+"px";

}


/* CASH OUT */

function cashOut(){

if(!running)
return;


const winnings=
betAmount*
multiplier;


balance+=
winnings;


updateBalance();


running=false;

clearInterval(timer);


liveStatus.textContent=
"CASHED";


statusEl.textContent=
"Cashed out at "+
multiplier.toFixed(2)+
"x";


multEl.classList.add(
"cashGlow"
);


addHistory(
"✓ "+
multiplier.toFixed(2)+
"x",
true
);


finishRound();

}


/* CRASH */

function crash(){

running=false;

clearInterval(timer);


liveStatus.textContent=
"CRASH";


crashDisplay.textContent=
crashPoint.toFixed(2)+"x";


multEl.textContent=
"💥 "+
crashPoint.toFixed(2)+
"x";


multEl.classList.add(
"crashed"
);


statusEl.textContent=
"CRASHED at "+
crashPoint.toFixed(2)+
"x";


rocket.classList.add(
"crashedRocket"
);


/* EXPLOSION */

explosion.classList.remove(
"explode"
);

void explosion.offsetWidth;

explosion.classList.add(
"explode"
);


/* FLASH */

gameBox.classList.remove(
"crashFlash"
);

void gameBox.offsetWidth;

gameBox.classList.add(
"crashFlash"
);


addHistory(
"💥 "+
crashPoint.toFixed(2)+
"x",
false
);


finishRound();

}


/* FINISH */

function finishRound(){

startBtn.disabled=false;

betEl.disabled=false;

cashBtn.disabled=true;

}


/* HISTORY */

function addHistory(
text,
win
){

const item=
document.createElement("div");


item.className=
win?
"result win":
"result";


item.textContent=
text;


historyList.prepend(
item
);


while(
historyList.children.length>10
){

historyList.removeChild(
historyList.lastChild
);

}

}


/* RESET */

function resetGame(){

clearInterval(timer);

clearInterval(countdownTimer);


balance=1000;

multiplier=1;

roundHigh=1;

running=false;

countingDown=false;

points=[];


updateBalance();


multEl.textContent=
"1.00x";

multEl.classList.remove(
"crashed",
"cashGlow"
);


highEl.textContent=
"1.00x";

crashDisplay.textContent=
"???";


liveStatus.textContent=
"READY";


statusEl.textContent=
"Place your demo bet to start";


countdownEl.textContent="";


startBtn.disabled=false;

betEl.disabled=false;

cashBtn.disabled=true;


historyList.innerHTML="";


rocket.style.display=
"none";

rocket.classList.remove(
"crashedRocket"
);


explosion.classList.remove(
"explode"
);


gameBox.classList.remove(
"crashFlash"
);


drawGraph();

}


/* RESIZE */

window.addEventListener(
"resize",
resizeCanvas
);


/* INITIALIZE */

updateBalance();

resizeCanvas();

</script>

</body>
</html>
