<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crash Game Demo</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#050a12;
color:white;
font-family:Arial,sans-serif;
}

.wrap{
max-width:480px;
margin:auto;
padding:16px;
}

.brand{
text-align:center;
color:#20e0a0;
font-size:28px;
font-weight:900;
margin:10px 0 18px;
text-shadow:0 0 18px #20e0a0;
}

.balance{
background:#101827;
border:1px solid #263653;
padding:14px;
border-radius:15px;
text-align:center;
box-shadow:0 0 25px #0008;
}

.balance small{
color:#8fa2ba;
}

.balance span{
display:block;
font-size:30px;
font-weight:900;
margin-top:5px;
}

.game{
margin-top:14px;
background:#08111f;
border:1px solid #263653;
border-radius:15px;
padding:14px;
text-align:center;
box-shadow:inset 0 0 35px #0009;
}

.mult{
font-size:60px;
font-weight:900;
margin:14px 0 5px;
color:#20e0a0;
text-shadow:0 0 20px #20e0a0;
transition:.2s;
}

.mult.crashText{
color:#ff4444 !important;
text-shadow:
0 0 10px #ff2222,
0 0 30px #ff0000;
}

.status{
min-height:25px;
color:#9fb0c5;
margin-bottom:10px;
font-size:15px;
}

.graphbox{
position:relative;
width:100%;
height:240px;
overflow:hidden;
border-radius:13px;
}

#graph{
width:100%;
height:240px;
background:
radial-gradient(
circle at center,
#10223a 0%,
#09111f 70%
);
border-radius:13px;
border:1px solid #1e304d;
}

#rocket{
position:absolute;
font-size:34px;
display:none;
transform:translate(-50%,-50%);
pointer-events:none;
z-index:5;

filter:
drop-shadow(0 0 6px #20e0a0)
drop-shadow(0 0 14px #20e0a0)
drop-shadow(0 0 25px #20e0a0);
}

#rocket::after{
content:"";
position:absolute;
width:42px;
height:9px;
right:21px;
top:14px;

background:linear-gradient(
to left,
#fff176,
#ff8c00,
#ff3b20,
transparent
);

border-radius:50%;
filter:blur(3px);
z-index:-1;
}

.crashedRocket{
animation:rocketShake .08s infinite;
}

@keyframes rocketShake{

0%{
transform:translate(-50%,-50%) rotate(-10deg);
}

50%{
transform:translate(-50%,-50%) rotate(10deg);
}

100%{
transform:translate(-50%,-50%) rotate(-10deg);
}

}

/* Explosion */

#explosion{
position:absolute;
left:50%;
top:50%;
font-size:70px;
transform:translate(-50%,-50%) scale(0);
display:none;
z-index:10;
pointer-events:none;
}

.explode{
display:block !important;
animation:explode .8s ease-out forwards;
}

@keyframes explode{

0%{
transform:translate(-50%,-50%) scale(.1);
opacity:0;
}

20%{
transform:translate(-50%,-50%) scale(1.5);
opacity:1;
}

60%{
transform:translate(-50%,-50%) scale(1.1);
opacity:1;
}

100%{
transform:translate(-50%,-50%) scale(2);
opacity:0;
}

}

/* Red crash flash */

.crashFlash{
animation:flash .45s ease;
}

@keyframes flash{

0%{
box-shadow:0 0 0 rgba(255,0,0,0);
}

30%{
box-shadow:
inset 0 0 80px rgba(255,0,0,.75),
0 0 35px rgba(255,0,0,.6);
}

100%{
box-shadow:0 0 0 rgba(255,0,0,0);
}

}

.controls{
margin-top:14px;
background:#101827;
padding:14px;
border-radius:14px;
}

label{
display:block;
color:#d8e2ef;
margin-bottom:4px;
}

input,
button{
width:100%;
padding:15px;
margin-top:8px;
border-radius:11px;
border:0;
font-size:16px;
}

input{
background:#182235;
color:white;
outline:none;
border:1px solid #263653;
}

button{
background:#20e0a0;
color:#06140e;
font-weight:900;
box-shadow:0 0 14px #20e0a044;
}

button:active{
transform:scale(.98);
}

button:disabled{
opacity:.45;
}

.cash{
background:#ffb020;
color:#1a1100;
}

.reset{
background:#253a55;
color:white;
}

.history{
margin-top:14px;
background:#101827;
border-radius:14px;
padding:14px;
}

.history h3{
margin:0 0 10px;
}

#historyList{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:3px;
}

.crash{
background:#321b1b;
color:#ff7777;
padding:9px 13px;
border-radius:9px;
white-space:nowrap;
font-weight:bold;
}

.win{
background:#123b2d;
color:#20e0a0;
}

.note{
text-align:center;
color:#71849b;
font-size:11px;
margin-top:14px;
padding-bottom:8px;
}

/* Balance change animation */

.balancePop{
animation:balancePop .35s ease;
}

@keyframes balancePop{

50%{
transform:scale(1.08);
}

}

/* Cashout message */

.cashoutGlow{
animation:cashoutGlow .6s ease;
}

@keyframes cashoutGlow{

50%{
text-shadow:
0 0 10px #20e0a0,
0 0 35px #20e0a0;
}

}
</style>
</head>

<body>

<div class="wrap">

<div class="brand">
🚀 CRASH DEMO
</div>

<div class="balance" id="balanceBox">

<small>Demo Balance</small>

<span id="balance">
1000.00
</span>

</div>

<div class="game" id="gameBox">

<div class="mult" id="mult">
1.00x
</div>

<div class="status" id="status">
Place your demo bet to start
</div>

<div class="graphbox">

<canvas id="graph"></canvas>

<div id="rocket">
🚀
</div>

<div id="explosion">
💥
</div>

</div>

</div>

<div class="controls">

<label>
Demo Bet Amount
</label>

<input
id="bet"
type="number"
min="1"
value="50"
>

<button
id="start"
onclick="startGame()"
>
🚀 START ROUND
</button>

<button
id="cash"
class="cash"
onclick="cashOut()"
disabled
>
💰 CASH OUT
</button>

<button
class="reset"
onclick="resetGame()"
>
RESET DEMO
</button>

</div>

<div class="history">

<h3>
Recent Results
</h3>

<div id="historyList">
</div>

</div>

<div class="note">
DEMO GAME — NO REAL MONEY OR REAL BETTING
</div>

</div>

<script>

let balance=1000;
let multiplier=1;
let crashPoint=0;
let timer=null;
let running=false;
let betAmount=0;
let points=[];

const balanceEl=
document.getElementById("balance");

const balanceBox=
document.getElementById("balanceBox");

const multEl=
document.getElementById("mult");

const statusEl=
document.getElementById("status");

const betEl=
document.getElementById("bet");

const startBtn=
document.getElementById("start");

const cashBtn=
document.getElementById("cash");

const historyList=
document.getElementById("historyList");

const gameBox=
document.getElementById("gameBox");

const canvas=
document.getElementById("graph");

const ctx=
canvas.getContext("2d");

const rocket=
document.getElementById("rocket");

const explosion=
document.getElementById("explosion");


function resizeCanvas(){

const rect=
canvas.getBoundingClientRect();

canvas.width=
rect.width*window.devicePixelRatio;

canvas.height=
rect.height*window.devicePixelRatio;

ctx.setTransform(
window.devicePixelRatio,
0,
0,
window.devicePixelRatio,
0,
0
);

drawGraph();

}


function updateBalance(){

balanceEl.textContent=
balance.toFixed(2);

balanceBox.classList.remove(
"balancePop"
);

void balanceBox.offsetWidth;

balanceBox.classList.add(
"balancePop"
);

}


function randomCrash(){

return +(
1.05+
Math.random()*8.95
).toFixed(2);

}


function startGame(){

if(running)return;

betAmount=
Number(betEl.value);

if(betAmount<=0){

statusEl.textContent=
"Enter a valid demo bet.";

return;

}

if(betAmount>balance){

statusEl.textContent=
"Not enough demo balance.";

return;

}

balance-=betAmount;

updateBalance();

multiplier=1;

crashPoint=
randomCrash();

points=[1];

running=true;

multEl.textContent="1.00x";

multEl.style.color=
"#20e0a0";

multEl.classList.remove(
"crashText",
"cashoutGlow"
);

statusEl.textContent=
"Round running...";

startBtn.disabled=true;

betEl.disabled=true;

cashBtn.disabled=false;

rocket.style.display=
"block";

rocket.classList.remove(
"crashedRocket"
);

explosion.classList.remove(
"explode"
);

gameBox.classList.remove(
"crashFlash"
);

drawGraph();

timer=
setInterval(
runGame,
100
);

}


function runGame(){

multiplier+=
0.01+
multiplier*0.006;

points.push(
multiplier
);

multEl.textContent=
multiplier.toFixed(2)+"x";

drawGraph();

if(multiplier>=crashPoint){

crash();

}

}


function drawGraph(){

const w=
canvas.clientWidth;

const h=
canvas.clientHeight;

ctx.clearRect(
0,
0,
w,
h
);


/* Grid */

ctx.strokeStyle=
"#172943";

ctx.lineWidth=1;

for(
let x=0;
x<w;
x+=40
){

ctx.beginPath();

ctx.moveTo(x,0);

ctx.lineTo(x,h);

ctx.stroke();

}

for(
let y=0;
y<h;
y+=40
){

ctx.beginPath();

ctx.moveTo(0,y);

ctx.lineTo(w,y);

ctx.stroke();

}


if(points.length<2){

rocket.style.left=
"10px";

rocket.style.top=
(h-20)+"px";

return;

}


const maxValue=
Math.max(
2,
...points
)*1.15;


let lastX=10;
let lastY=h-10;


/* Graph path */

ctx.beginPath();

points.forEach(
(value,i)=>{

const x=
Math.min(
10+i*4,
w-20
);

const y=
h-
((value-1)/
(maxValue-1)*
(h-20))
-10;

if(i===0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}

lastX=x;
lastY=y;

});


/* Glow */

ctx.strokeStyle=
"#20e0a044";

ctx.lineWidth=12;

ctx.lineJoin=
"round";

ctx.stroke();


/* Main line */

ctx.beginPath();

points.forEach(
(value,i)=>{

const x=
Math.min(
10+i*4,
w-20
);

const y=
h-
((value-1)/
(maxValue-1)*
(h-20))
-10;

if(i===0){

ctx.moveTo(x,y);

}else{

ctx.lineTo(x,y);

}

});


ctx.strokeStyle=
"#20e0a0";

ctx.lineWidth=4;

ctx.lineJoin=
"round";

ctx.stroke();


/* Rocket position */

rocket.style.left=
lastX+"px";

rocket.style.top=
lastY+"px";

}


function cashOut(){

if(!running)return;

const winnings=
betAmount*multiplier;

balance+=
winnings;

updateBalance();

running=false;

clearInterval(timer);

statusEl.textContent=
"Cashed out at "+
multiplier.toFixed(2)+
"x";

multEl.style.color=
"#20e0a0";

multEl.classList.add(
"cashoutGlow"
);

addHistory(
"✓ "+
multiplier.toFixed(2)+
"x",
true
);

finishRound();

}


function crash(){

running=false;

clearInterval(timer);

multEl.textContent=
"💥 "+
crashPoint.toFixed(2)+
"x";

multEl.style.color=
"#ff4444";

multEl.classList.add(
"crashText"
);

statusEl.textContent=
"CRASHED at "+
crashPoint.toFixed(2)+
"x";

rocket.classList.add(
"crashedRocket"
);


/* Explosion */

explosion.classList.remove(
"explode"
);

void explosion.offsetWidth;

explosion.classList.add(
"explode"
);


/* Red flash */

gameBox.classList.remove(
"crashFlash"
);

void gameBox.offsetWidth;

gameBox.classList.add(
"crashFlash"
);


addHistory(
"💥 "+
crashPoint.toFixed(2)+
"x",
false
);

finishRound();

}


function finishRound(){

startBtn.disabled=false;

betEl.disabled=false;

cashBtn.disabled=true;

}


function addHistory(
text,
win
){

const item=
document.createElement("div");

item.className=
win?
"crash win":
"crash";

item.textContent=
text;

historyList.prepend(
item
);

while(
historyList.children.length>10
){

historyList.removeChild(
historyList.lastChild
);

}

}


function resetGame(){

clearInterval(timer);

balance=1000;

multiplier=1;

running=false;

points=[];

updateBalance();

multEl.textContent=
"1.00x";

multEl.style.color=
"#20e0a0";

multEl.classList.remove(
"crashText",
"cashoutGlow"
);

statusEl.textContent=
"Place your demo bet to start";

startBtn.disabled=false;

betEl.disabled=false;

cashBtn.disabled=true;

historyList.innerHTML="";

rocket.style.display=
"none";

rocket.classList.remove(
"crashedRocket"
);

explosion.classList.remove(
"explode"
);

gameBox.classList.remove(
"crashFlash"
);

drawGraph();

}


window.addEventListener(
"resize",
resizeCanvas
);

updateBalance();

resizeCanvas();

</script>

</body>
</html>
